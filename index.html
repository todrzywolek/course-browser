<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Course Browser 🎓</title>
<style>
/* ── Reset & variables ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0f1117;
  --bg2:       #161b24;
  --bg3:       #1e2535;
  --border:    #2a3347;
  --accent:    #4f8ef7;
  --accent2:   #6ba3ff;
  --text:      #e0e6f0;
  --text2:     #8899b0;
  --text3:     #5a6a80;
  --success:   #34d399;
  --warn:      #fbbf24;
  --sidebar-w: 300px;
  --topbar-h:  52px;
  --radius:    8px;
  --shadow:    0 4px 24px rgba(0,0,0,.5);
}

html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: var(--bg); color: var(--text); line-height: 1.6; overflow: hidden; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Screens ───────────────────────────────────────────────────────────── */
.screen { height: 100vh; }
.hidden { display: none !important; }

/* ── Home screen ───────────────────────────────────────────────────────── */
#home-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 40px; padding: 40px 20px;
  overflow-y: auto;
}
#home-screen h1 { font-size: 2rem; text-align: center; }
#home-screen .subtitle { color: var(--text2); text-align: center; margin-top: -28px; }

.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px; width: 100%; max-width: 960px;
}
.course-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px 24px;
  cursor: pointer; transition: border-color .15s, transform .15s;
  text-align: left;
}
.course-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.course-card .cc-icon { font-size: 2.2rem; margin-bottom: 12px; }
.course-card h2 { font-size: 1.05rem; margin-bottom: 6px; }
.course-card .cc-meta { font-size: .82rem; color: var(--text2); }
.course-card .cc-progress { font-size: .78rem; color: var(--text3); margin-top: 6px; }

.spinner { display: inline-block; width: 20px; height: 20px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── App layout ────────────────────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; }

#topbar {
  height: var(--topbar-h); min-height: var(--topbar-h);
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px;
  flex-shrink: 0; z-index: 10;
}
#topbar .course-title { font-weight: 700; font-size: 1.05rem; flex: 1;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#topbar .stats { font-size: .8rem; color: var(--text2); white-space: nowrap; }
.btn-back {
  padding: 6px 14px; background: transparent;
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text2); font-size: .82rem; cursor: pointer; white-space: nowrap;
  transition: border-color .15s, color .15s;
}
.btn-back:hover { border-color: var(--accent); color: var(--accent); }

#body { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ───────────────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--bg2); border-right: 1px solid var(--border);
  overflow-y: auto; flex-shrink: 0;
}
.sidebar-search {
  position: sticky; top: 0; z-index: 2;
  padding: 12px 12px 8px; background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.sidebar-search input {
  width: 100%; padding: 7px 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: .84rem; outline: none;
}
.sidebar-search input:focus { border-color: var(--accent); }

.category-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px 10px 12px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  background: var(--bg2); user-select: none; transition: background .1s;
}
.category-header:hover { background: var(--bg3); }
.cat-arrow { font-size: .65rem; color: var(--text3); transition: transform .2s; flex-shrink: 0; }
.cat-name { font-size: .82rem; font-weight: 600; color: var(--text2);
            text-transform: uppercase; letter-spacing: .04em; flex: 1; }
.cat-count { font-size: .72rem; color: var(--text3); flex-shrink: 0; }
.category.open .cat-arrow { transform: rotate(90deg); }
.posts-list { display: none; }
.category.open .posts-list { display: block; }

.post-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px 8px 22px; cursor: pointer; font-size: .85rem;
  color: var(--text2); border-left: 2px solid transparent;
  transition: background .1s, color .1s, border-color .1s; line-height: 1.4;
}
.post-item:hover { background: var(--bg3); color: var(--text); }
.post-item.active {
  background: rgba(79,142,247,.12); color: var(--accent);
  border-left-color: var(--accent);
}
.post-icon { font-size: .75rem; flex-shrink: 0; opacity: .7; }
.post-name-text { flex: 1; overflow: hidden; display: -webkit-box;
                  -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ── Main content ──────────────────────────────────────────────────────── */
#main { flex: 1; overflow-y: auto; padding: 28px 36px; background: var(--bg); }

#placeholder {
  height: 100%; display: flex; align-items: center;
  justify-content: center; flex-direction: column; gap: 12px; color: var(--text3);
}
#placeholder .big-icon { font-size: 4rem; }

#content { display: none; max-width: 960px; }
#content.visible { display: block; }

.post-header { margin-bottom: 20px; }
.post-header h2 { font-size: 1.4rem; font-weight: 700; line-height: 1.3; }
.post-header .post-meta { font-size: .8rem; color: var(--text3); margin-top: 4px; }

/* Video (Google Drive iframe) */
.video-wrap {
  position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
  border-radius: var(--radius); background: #000;
  margin-bottom: 24px; border: 1px solid var(--border);
}
.video-wrap iframe {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  border: none; border-radius: var(--radius);
}
.no-video {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; color: var(--text3);
  font-size: .9rem; margin-bottom: 24px; text-align: center;
}

/* Description */
.section-title {
  font-size: .75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--text3); margin-bottom: 12px;
}
.description-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 24px;
  margin-bottom: 24px; font-size: .93rem; line-height: 1.8;
}
.description-box a { color: var(--accent); }
.description-box a:hover { color: var(--accent2); }
.description-box p { margin-bottom: 10px; }
.description-box p:last-child { margin-bottom: 0; }
.description-box ul, .description-box ol { margin: 8px 0 8px 20px; }
.description-box li { margin-bottom: 4px; }
.description-box hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.description-box strong { color: var(--text); }

/* Documents */
.docs-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px; margin-bottom: 32px;
}
.doc-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
  cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 10px;
  transition: border-color .15s, background .15s; text-decoration: none;
}
.doc-card:hover { border-color: var(--accent); background: var(--bg3); }
.doc-card.unavailable { opacity: .38; cursor: default; }
.doc-card.unavailable:hover { border-color: var(--border); background: var(--bg2); }
.doc-icon { font-size: 1.4rem; flex-shrink: 0; }
.doc-info { overflow: hidden; }
.doc-name { font-size: .83rem; font-weight: 600; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
.doc-meta { font-size: .73rem; color: var(--text3); }

/* Inline viewer */
.viewer-wrap {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  margin-top: 10px; margin-bottom: 24px;
}
.viewer-bar {
  display: flex; align-items: center; padding: 8px 12px;
  border-bottom: 1px solid var(--border); gap: 8px;
}
.viewer-bar span { flex: 1; font-size: .83rem; color: var(--text2);
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-close-viewer {
  background: none; border: none; color: var(--text3); cursor: pointer;
  font-size: 1.1rem; padding: 2px 6px; border-radius: 4px;
  transition: background .1s, color .1s;
}
.btn-close-viewer:hover { background: var(--bg3); color: var(--text); }
.viewer-wrap .embed-frame { width: 100%; height: 600px; border: none; display: block; }
.viewer-wrap .audio-frame { width: 100%; height: 80px; border: none; display: block; }

/* Search highlight */
.highlight { background: rgba(79,142,247,.25); border-radius: 2px; }

/* ── Mobile hamburger button ───────────────────────────────────────────── */
.btn-menu {
  display: none;
  padding: 6px 10px;
  background: transparent;
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text2); font-size: 1.2rem; line-height: 1;
  cursor: pointer; flex-shrink: 0;
  transition: border-color .15s, color .15s;
}
.btn-menu:hover { border-color: var(--accent); color: var(--accent); }

/* ── Sidebar overlay (mobile) ──────────────────────────────────────────── */
#sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 19;
}
#sidebar-overlay.visible { display: block; }

/* ── Mobile breakpoint ─────────────────────────────────────────────────── */
@media (max-width: 680px) {
  :root { --sidebar-w: min(80vw, 300px); }

  /* Show hamburger, hide stats in topbar */
  .btn-menu { display: inline-flex; align-items: center; }
  #topbar .stats { display: none; }

  /* Sidebar becomes a fixed off-canvas drawer */
  #sidebar {
    position: fixed;
    left: 0; top: var(--topbar-h);
    height: calc(100dvh - var(--topbar-h));
    z-index: 20;
    transform: translateX(-100%);
    transition: transform .25s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,.5);
  }
  #sidebar.open { transform: translateX(0); }

  /* Main fills the full width */
  #main { padding: 16px; }

  /* Home screen: single column on very small screens */
  .course-grid { grid-template-columns: 1fr; }

  /* Video: Drive player has title bar + controls that push beyond pure 16:9.
     min-height ensures the player chrome is never clipped by overflow:hidden. */
  .video-wrap { min-height: 300px; }

  /* Reduce embed height */
  .viewer-wrap .embed-frame { height: 320px; }

  /* Home screen heading */
  #home-screen h1 { font-size: 1.5rem; }

  /* Description box padding */
  .description-box { padding: 14px 16px; }
}
</style>
</head>
<body>

<!-- ── Home screen ─────────────────────────────────────────────────────── -->
<div id="home-screen" class="screen">
  <h1>🎓 Course Browser</h1>
  <p class="subtitle">Pick a course to start watching.</p>
  <div class="course-grid" id="course-grid">
    <div class="spinner"></div>
  </div>
</div>

<!-- ── Course browser ──────────────────────────────────────────────────── -->
<div id="app" class="screen hidden">
  <div id="topbar">
    <button class="btn-back" onclick="goHome()">← All Courses</button>
    <button class="btn-menu" id="btn-menu" onclick="toggleSidebar()" aria-label="Toggle lesson list">☰</button>
    <span class="course-title" id="course-title">Course</span>
    <span class="stats" id="course-stats"></span>
  </div>

  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div id="body">
    <nav id="sidebar">
      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="🔍  Search lessons…"
               oninput="filterSidebar(this.value)" />
      </div>
      <div id="categories-list"></div>
    </nav>

    <main id="main">
      <div id="placeholder">
        <div class="big-icon">🎬</div>
        <div>Select a lesson from the sidebar to start watching.</div>
      </div>

      <div id="content">
        <div class="post-header">
          <h2 id="post-title"></h2>
          <div class="post-meta" id="post-meta"></div>
        </div>
        <div id="video-area"></div>
        <div id="desc-area"></div>
        <div id="docs-area"></div>
        <div id="viewer-area"></div>
      </div>
    </main>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allCourses   = [];
let activeCourse = null;
let activePostId = null;

// ── Routing helpers ────────────────────────────────────────────────────────
function pushUrl(courseId, postId) {
  let hash = '#';
  if (courseId) hash += '/' + courseId;
  if (postId)   hash += '/' + postId;
  history.pushState(null, '', hash);
  updateTitle(courseId, postId);
}

function parseHash() {
  const raw   = location.hash.replace(/^#\/?/, '');
  const parts = raw ? raw.split('/').filter(Boolean) : [];
  return { courseId: parts[0] || null, postId: parts[1] || null };
}

function updateTitle(courseId, postId) {
  if (!courseId) { document.title = 'Course Browser 🎓'; return; }
  const course = allCourses.find(c => c.id === courseId);
  if (!course)  { document.title = 'Course Browser 🎓'; return; }
  if (postId) {
    const post = course.categories.flatMap(c => c.posts).find(p => p.id === postId);
    document.title = post ? `${post.name} — ${course.title}` : course.title;
  } else {
    document.title = course.title + ' 🎓';
  }
}

// Navigate the UI based on the current URL hash (called on popstate + boot)
function navigateFromUrl() {
  if (!allCourses.length) return;
  const { courseId, postId } = parseHash();

  if (!courseId) {
    activeCourse = null;
    activePostId = null;
    if (allCourses.length === 1) {
      // Single-course: jump straight in without a history push
      _renderCourse(allCourses[0]);
      const first = allCourses[0].categories.flatMap(c => c.posts)
        .find(p => p.video_drive_id || p.description || p.documents.length);
      if (first) _renderPost(first.id);
    } else {
      renderHome();
      updateTitle(null, null);
    }
    return;
  }

  const course = allCourses.find(c => c.id === courseId);
  if (!course) { renderHome(); return; }

  _renderCourse(course);
  const targetId = postId
    ? postId
    : course.categories.flatMap(c => c.posts)
        .find(p => p.video_drive_id || p.description || p.documents.length)?.id;
  if (targetId) _renderPost(targetId);
  updateTitle(courseId, targetId);
}

window.addEventListener('popstate', navigateFromUrl);

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch('./courses.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allCourses = await res.json();
  } catch (e) {
    document.getElementById('course-grid').innerHTML =
      `<p style="color:var(--danger)">Failed to load courses.json: ${e.message}</p>`;
    return;
  }

  navigateFromUrl();
}

// ── Home ───────────────────────────────────────────────────────────────────
function renderHome() {
  show('home-screen');
  const grid = document.getElementById('course-grid');
  grid.innerHTML = '';

  allCourses.forEach((course, i) => {
    const n_cats  = course.categories.length;
    const n_posts = course.categories.reduce((s, c) => s + c.posts.length, 0);
    const n_vids  = course.categories.reduce((s, c) =>
      s + c.posts.filter(p => p.video_drive_id).length, 0);
    const icons   = ['📘','📗','📙','📕','📓'];
    const icon    = icons[i % icons.length];

    const card = document.createElement('div');
    card.className = 'course-card';
    card.innerHTML = `
      <div class="cc-icon">${icon}</div>
      <h2>${esc(course.title)}</h2>
      <div class="cc-meta">${n_cats} modules · ${n_posts} lessons</div>
      <div class="cc-progress">${n_vids} videos linked</div>`;
    card.onclick = () => openCourse(course);
    grid.appendChild(card);
  });
}

function goHome() {
  activeCourse = null;
  activePostId = null;
  pushUrl(null, null);
  renderHome();
}

// ── Open course ─────────────────────────────────────────────────────────────
// Internal: render course UI without touching the URL
function _renderCourse(course) {
  activeCourse = course;
  activePostId = null;
  show('app');

  document.getElementById('course-title').textContent = '🎓  ' + course.title;
  const n_posts = course.categories.reduce((s, c) => s + c.posts.length, 0);
  const n_vids  = course.categories.reduce((s, c) =>
    s + c.posts.filter(p => p.video_drive_id).length, 0);
  document.getElementById('course-stats').textContent =
    `${n_posts} posts · ${n_vids} videos`;
  document.getElementById('search-input').value = '';
  document.getElementById('main').scrollTop = 0;

  renderSidebar(course.categories);

  // Reset content pane
  document.getElementById('placeholder').style.display = '';
  document.getElementById('content').classList.remove('visible');
}

// User action: open a course and push a URL entry
function openCourse(course) {
  _renderCourse(course);
  const first = course.categories
    .flatMap(c => c.posts)
    .find(p => p.video_drive_id || p.description || p.documents.length);
  pushUrl(course.id, first ? first.id : null);
  if (first) _renderPost(first.id);
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function renderSidebar(categories, query = '') {
  const container = document.getElementById('categories-list');
  container.innerHTML = '';
  const q = query.toLowerCase();

  categories.forEach((cat, ci) => {
    const posts = q
      ? cat.posts.filter(p => p.name.toLowerCase().includes(q))
      : cat.posts;
    if (q && posts.length === 0) return;

    const catEl = document.createElement('div');
    catEl.className = 'category' + (ci === 0 || q ? ' open' : '');

    catEl.innerHTML = `
      <div class="category-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="cat-arrow">▶</span>
        <span class="cat-name">${esc(cat.name)}</span>
        <span class="cat-count">${posts.length}</span>
      </div>
      <div class="posts-list"></div>`;

    const list = catEl.querySelector('.posts-list');
    posts.forEach(post => {
      const hasVideo = !!post.video_drive_id;
      const hasDocs  = post.documents.some(d => d.drive_id);
      const icon     = hasVideo ? '🎬' : (hasDocs ? '📄' : '💬');

      const item = document.createElement('div');
      item.className = 'post-item' + (post.id === activePostId ? ' active' : '');
      item.dataset.postId = post.id;
      item.onclick = () => selectPost(post.id);

      const nameHtml = q
        ? esc(post.name).replace(new RegExp(escRe(esc(q)), 'gi'),
            m => `<mark class="highlight">${m}</mark>`)
        : esc(post.name);

      item.innerHTML = `
        <span class="post-icon">${icon}</span>
        <span class="post-name-text">${nameHtml}</span>`;
      list.appendChild(item);
    });
    container.appendChild(catEl);
  });
}

function filterSidebar(q) {
  if (!activeCourse) return;
  renderSidebar(activeCourse.categories, q.trim());
  if (activePostId) {
    const el = document.querySelector(`.post-item[data-post-id="${activePostId}"]`);
    if (el) el.classList.add('active');
  }
}

// ── Post ───────────────────────────────────────────────────────────────────
// Internal: render post UI without touching the URL
function _renderPost(postId) {
  activePostId = postId;
  document.querySelectorAll('.post-item').forEach(el =>
    el.classList.toggle('active', el.dataset.postId === postId));

  const post = activeCourse.categories.flatMap(c => c.posts).find(p => p.id === postId);
  const cat  = activeCourse.categories.find(c => c.posts.some(p => p.id === postId));
  if (!post) return;

  closeSidebar(); // auto-close drawer on mobile after picking a lesson
  renderPost(post, cat);
  document.querySelector(`.post-item[data-post-id="${postId}"]`)
          ?.scrollIntoView({ block: 'nearest' });
}

// User action: select a lesson and push a URL entry
function selectPost(postId) {
  if (activeCourse) pushUrl(activeCourse.id, postId);
  _renderPost(postId);
}

function renderPost(post, cat) {
  document.getElementById('placeholder').style.display = 'none';
  const content = document.getElementById('content');
  content.classList.add('visible');
  document.getElementById('main').scrollTop = 0;

  // Header
  document.getElementById('post-title').textContent = post.name;
  const linkedDocs = post.documents.filter(d => d.drive_id).length;
  document.getElementById('post-meta').textContent =
    (cat ? cat.name + '  ·  ' : '') +
    (post.video_drive_id ? '🎬 Video' : '— No video') +
    (linkedDocs ? `  ·  📎 ${linkedDocs} document(s)` : '');

  // Video
  const va = document.getElementById('video-area');
  if (post.video_drive_id) {
    const url = driveEmbed(post.video_drive_id);
    va.innerHTML = `
      <div class="video-wrap">
        <iframe src="${url}" allow="autoplay" allowfullscreen
                loading="lazy"></iframe>
      </div>`;
  } else {
    va.innerHTML = `<div class="no-video">No video linked for this post.</div>`;
  }

  // Description
  const da = document.getElementById('desc-area');
  if (post.description?.trim()) {
    da.innerHTML = `
      <p class="section-title">Description</p>
      <div class="description-box">${post.description}</div>`;
  } else {
    da.innerHTML = '';
  }

  // Documents
  const docsArea = document.getElementById('docs-area');
  if (post.documents.length) {
    const cards = post.documents.map(doc => {
      const available = !!doc.drive_id;
      const icon  = mimeIcon(doc.mime);
      const label = mimeLabel(doc.mime, doc.name);
      if (!available) {
        return `
          <div class="doc-card unavailable" title="Not yet linked to Google Drive">
            <span class="doc-icon" style="opacity:.4">${icon}</span>
            <div class="doc-info">
              <div class="doc-name">${esc(doc.name)}</div>
              <div class="doc-meta">${label} · not linked</div>
            </div>
          </div>`;
      }
      return `
        <div class="doc-card" onclick="openDoc(${JSON.stringify(doc).replace(/"/g,'&quot;')})">
          <span class="doc-icon">${icon}</span>
          <div class="doc-info">
            <div class="doc-name" title="${esc(doc.name)}">${esc(doc.name)}</div>
            <div class="doc-meta">${label}</div>
          </div>
        </div>`;
    }).join('');
    docsArea.innerHTML = `
      <p class="section-title">Documents &amp; Attachments</p>
      <div class="docs-grid">${cards}</div>`;
  } else {
    docsArea.innerHTML = '';
  }

  document.getElementById('viewer-area').innerHTML = '';
}

// ── Document opener ────────────────────────────────────────────────────────
function openDoc(doc) {
  const viewerArea = document.getElementById('viewer-area');
  const mime = doc.mime || '';

  if (mime === 'application/zip' || mime === 'application/octet-stream') {
    // Direct download via Drive
    window.open(driveDownload(doc.drive_id), '_blank');
    return;
  }

  // Everything else (PDF, audio, video extras) → embed with Drive preview
  const embedUrl = driveEmbed(doc.drive_id);
  const isAudio  = mime.startsWith('audio/');
  const frameClass = isAudio ? 'audio-frame' : 'embed-frame';

  viewerArea.innerHTML = `
    <div class="viewer-wrap">
      <div class="viewer-bar">
        <span>${isAudio ? '🎵  ' : '📄  '}${esc(doc.name)}</span>
        <button class="btn-close-viewer" onclick="closeViewer()" title="Close">✕</button>
      </div>
      <iframe class="${frameClass}" src="${embedUrl}"
              allow="autoplay" allowfullscreen loading="lazy"></iframe>
    </div>`;
  // Scroll only #main (not the whole viewport) to avoid hiding the topbar on mobile.
  // scrollIntoView() can incorrectly scroll ancestor scroll containers on iOS/Android.
  const main = document.getElementById('main');
  setTimeout(() => main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' }), 50);
}

function closeViewer() {
  document.getElementById('viewer-area').innerHTML = '';
}

// ── Google Drive URL helpers ───────────────────────────────────────────────
function extractDriveId(idOrUrl) {
  if (!idOrUrl) return '';
  const m = String(idOrUrl).match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : idOrUrl;
}

function driveEmbed(idOrUrl) {
  return `https://drive.google.com/file/d/${extractDriveId(idOrUrl)}/preview`;
}

function driveDownload(idOrUrl) {
  return `https://drive.google.com/uc?export=download&id=${extractDriveId(idOrUrl)}`;
}

// ── Utilities ──────────────────────────────────────────────────────────────
function show(screenId) {
  ['home-screen', 'app'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', id !== screenId);
  });
}

function mimeIcon(mime) {
  if (!mime) return '📎';
  if (mime.startsWith('video/'))       return '🎬';
  if (mime.startsWith('audio/'))       return '🎵';
  if (mime === 'application/pdf')      return '📄';
  if (mime.includes('zip'))            return '🗜️';
  return '📎';
}

function mimeLabel(mime, name) {
  if (!mime) return ext(name) || 'File';
  if (mime.startsWith('video/'))       return 'Video';
  if (mime.startsWith('audio/'))       return 'Audio';
  if (mime === 'application/pdf')      return 'PDF';
  if (mime === 'application/zip')      return 'ZIP archive';
  return mime.split('/')[1]?.toUpperCase() || 'File';
}

function ext(name) {
  const m = String(name).match(/\.([^.]+)$/);
  return m ? m[1].toUpperCase() : '';
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function escRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
}

// ── Mobile sidebar ────────────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const isOpen  = sidebar.classList.toggle('open');
  overlay.classList.toggle('visible', isOpen);
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('visible');
}

// ── Start ──────────────────────────────────────────────────────────────────
boot();
</script>
